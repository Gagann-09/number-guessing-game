<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="dashboard-card" id="card" aria-labelledby="dashboard-title">
        <h1 id="dashboard-title">Number Guessing Dashboard</h1>
        <p class="subtitle">Can you guess the secret number?</p>
        
        <div id="game-setup">
            <button id="start-btn" class="primary-btn" aria-label="Start Game">Start Game</button>
        </div>

        <div id="game-active" style="display: none;">
            <div class="input-group">
                <input type="number" id="guess-input" placeholder="Enter a number" aria-label="Enter your guess">
                <button id="guess-btn" class="primary-btn" aria-label="Submit Guess">Submit Guess</button>
            </div>
            
            <div class="status-container" aria-live="polite" aria-atomic="true">
                <p id="status-text" role="status">Click Start to play.</p>
                <div class="attempts-badge" id="attempts-badge" aria-label="Attempts remaining">
                    <span class="attempts-label">Attempts Remaining</span>
                    <span id="attempts-text" class="attempts-value"></span>
                </div>
            </div>
        </div>

        <div id="game-over" style="display: none;">
            <button id="restart-btn" class="secondary-btn" aria-label="Start New Game">New Game</button>
        </div>
    </main>
</body>
</html>
