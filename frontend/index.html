<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Number Guessing Dashboard</h1>
    
    <div id="game-setup">
        <button id="start-btn">Start Game</button>
    </div>

    <div id="game-active" style="display: none;">
        <p id="status-text">Click Start to play.</p>
        <p id="attempts-text"></p>
        
        <div>
            <input type="text" id="guess-input" placeholder="Enter a number">
            <button id="guess-btn">Submit Guess</button>
        </div>
    </div>

    <div id="game-over" style="display: none;">
        <button id="restart-btn">Play Again</button>
    </div>
</body>
</html>
